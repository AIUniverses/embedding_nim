global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'embedding-service'
    static_configs:
      - targets: ['embedding-service:8009']
    metrics_path: '/metrics'
    scrape_interval: 5s
    # /metrics requires the service API key. Write the key to
    # ./monitoring/embedding_api_key, mount it into the Prometheus container and
    # uncomment the block below.
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/embedding_api_key

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 10s

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    scrape_interval: 10s
