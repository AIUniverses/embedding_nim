version: '3.8'

services:
  embedding-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: embedding-service-simple
    ports:
      - "8009:8009"
    environment:
      - HOST=0.0.0.0
      - PORT=8009
      - WORKERS=1
      - LOG_LEVEL=info
      - CONFIG_PATH=config/models.yaml
      - CUDA_VISIBLE_DEVICES=0
      - DEPLOYMENT_MODE=simple
      - ENABLE_REDIS=false
      - ENABLE_MONITORING=false
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:?EMBEDDING_API_KEY must be set}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
