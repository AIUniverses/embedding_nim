version: '3.8'

services:
  embedding-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: embedding-service-full
    ports:
      - "8009:8009"
    environment:
      - HOST=0.0.0.0
      - PORT=8009
      - WORKERS=2
      - LOG_LEVEL=info
      - CONFIG_PATH=config/models.yaml
      - CUDA_VISIBLE_DEVICES=0
      - DEPLOYMENT_MODE=full
      - ENABLE_REDIS=true
      - ENABLE_MONITORING=true
      - REDIS_URL=redis://redis:6379
      - PROMETHEUS_PORT=9090
      - GRAFANA_PORT=3000
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      - redis
      - prometheus

  # Redis for advanced caching and session management
  redis:
    image: redis:7-alpine
    container_name: embedding-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: embedding-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: embedding-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

  # Vector Database (Qdrant) for advanced embedding storage
  qdrant:
    image: qdrant/qdrant:latest
    container_name: embedding-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  qdrant_data:
